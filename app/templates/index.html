<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevOps Task Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="app">

    <header class="header">
      <h1>DevOps Task Manager</h1>
      <div class="status-bar">
        <span id="backend-status" class="status-pill status-unknown">Backend: Checking...</span>
        <span id="db-status" class="status-pill status-unknown">Database: Checking...</span>
      </div>
    </header>

    <section class="stats">
      <div class="stat-card">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total Tasks</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-pending">0</span>
        <span class="stat-label">Pending</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-inprogress">0</span>
        <span class="stat-label">In Progress</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-completed">0</span>
        <span class="stat-label">Completed</span>
      </div>
    </section>

    <section class="add-task-card">
      <h2>Add Task</h2>
      <form id="add-task-form">
        <div class="form-row">
          <input type="text" id="task-title" placeholder="Task title" maxlength="200" required />
        </div>
        <div class="form-row">
          <textarea id="task-description" placeholder="Description (optional)" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
      <p id="form-error" class="form-error"></p>
    </section>

    <section class="task-list-card">
      <div class="task-list-header">
        <h2>Tasks</h2>
        <button id="refresh-btn" class="btn btn-secondary">Refresh</button>
      </div>
      <div id="task-list" class="task-list">
        <p class="empty-state" id="empty-state">No tasks yet. Add one above.</p>
      </div>
    </section>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
